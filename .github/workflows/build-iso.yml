name: Build Karen OS ISO

# Trigger: GitHub repo -> Actions tab -> "Run workflow"
on:
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-latest
    container:
      image: archlinux/archlinux:latest
      options: --privileged
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Update system + install archiso
        run: |
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Syu --noconfirm --needed
          pacman -S --noconfirm --needed archiso

      - name: Ship Karen payload into profile
        run: |
          mkdir -p os/profiles/karenos/airootfs/opt/karen-linux
          cp -f os/desktop/karen_shell.py os/profiles/karenos/airootfs/opt/karen-linux/
          cp -f os/desktop/karen-welcome.py os/profiles/karenos/airootfs/opt/karen-linux/
          cp -f os/desktop/requirements-linux.txt os/profiles/karenos/airootfs/opt/karen-linux/
          rm -f os/profiles/karenos/airootfs/opt/karen-linux/.ready

      - name: Build ISO
        run: mkarchiso -v -w /tmp/karen-work -o /tmp/karen-out os/profiles/karenos

      - name: Copy ISO to workspace
        run: |
          mkdir -p os/out
          cp /tmp/karen-out/*.iso os/out/

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: karenos-iso
          path: os/out/*.iso
          if-no-files-found: error