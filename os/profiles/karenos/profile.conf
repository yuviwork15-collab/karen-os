# ---------------------------------------------------------------------------
# Karen OS - archiso profile config
# Low-end optimized custom Arch Linux live ISO
# ---------------------------------------------------------------------------
iso_name="karenos"
iso_label="KARENOS_2026"
iso_publisher="Karen OS <https://karen.local>"
iso_application="Karen OS Live - low-end optimized desktop"
iso_version="1.0.0"
install_dir="karenos"
arch="x86_64"

# UEFI + legacy BIOS both supported
bootmodes=(
  'uefi-x64.systemd-boot.esp'
  'uefi-x64.eltorito.esp'
  'bios-syslinux.mbr'
  'bios-syslinux.eltorito'
)

pacman_conf="pacman.conf"

# zstd compression - fast + low RAM (4GB machines friendly)
airootfs_image_type="squashfs"
airootfs_image_tool_options=('-comp' 'zstd' '-Xcompression-level' '9')

file_permissions=(
  "/etc/shadow:root:root:400"
  "/root:root:root:750"
  "/opt/karen-linux/karen_shell.py:root:root:755"
  "/usr/local/bin/karen-bootstrap.sh:root:root:755"
)
