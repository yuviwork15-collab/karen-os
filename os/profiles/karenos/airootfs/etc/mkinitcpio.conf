# Karen OS - initramfs (live ISO)
# IMPORTANT: official archiso hook set without plymouth.
# plymouth breaks the live switch-root (rootfs mount/switch errors);
# boot splash is applied by karen-setup.sh on the INSTALLED system instead.
# USB modules forced in: this initramfs is built on a cloud VM (autodetect
# would prune xhci/usb-storage and the ISO stick would be invisible at boot).
MODULES=(usb-storage xhci_hcd ehci_pci uhci_hcd)
BINARIES=()
FILES=()
HOOKS=(base udev autodetect modconf kms keyboard keymap consolefont block filesystems archiso)
COMPRESSION="zstd"