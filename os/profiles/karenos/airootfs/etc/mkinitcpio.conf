# Karen OS - live ISO initramfs
# EXACT official archiso releng hook set (full module initramfs, no autodetect:
# the ISO is built on a cloud VM, so autodetect would prune the storage/USB
# controller drivers needed to find the USB stick on the real PC - that made
# the boot fail with "Failed to start Switch Root" on real hardware).
# USB + storage modules additionally forced in for belt-and-suspenders.
MODULES=(usb-storage uas xhci_hcd xhci_pci ehci_pci ohci_pci uhci_hcd)
BINARIES=()
FILES=()
HOOKS=(base udev microcode modconf kms memdisk archiso archiso_loop_mnt archiso_pxe_common archiso_pxe_nbd archiso_pxe_http archiso_pxe_nfs block filesystems keyboard)
COMPRESSION="zstd"