# Karen OS - initramfs with plymouth boot splash
# NOTE: keep the archiso hook! It mounts the squashfs and performs
# switch-root for the live ISO. Replacing it breaks boot (emergency mode).
MODULES=()
BINARIES=()
FILES=()
HOOKS=(base udev autodetect modconf kms keyboard keymap consolefont plymouth block filesystems archiso)
COMPRESSION="zstd"
